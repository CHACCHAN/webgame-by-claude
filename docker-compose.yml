name: touge-nocturne

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-touge}
      POSTGRES_USER: ${DB_USERNAME:-touge}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-touge}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-touge} -d ${DB_DATABASE:-touge}"]
      interval: 3s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      APP_NAME: "Touge Nocturne"
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:8080}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-touge}
      DB_USERNAME: ${DB_USERNAME:-touge}
      DB_PASSWORD: ${DB_PASSWORD:-touge}
      CACHE_STORE: database
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      # online battle: Laravel Reverb (WebSocket) runs next to PHP-FPM in this container; its app
      # key/secret are generated at start-up unless provided (see docker/php/entrypoint.sh)
      BROADCAST_CONNECTION: reverb
      START_REVERB: "true"
      REVERB_APP_ID: ${REVERB_APP_ID:-touge}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-}
      REVERB_HOST: 127.0.0.1
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    networks:
      - default
      - edge
    depends_on:
      - app

  # --- public access: Cloudflare Tunnel, started by `docker compose up` when .env has COMPOSE_PROFILES=tunnel
  # Hostname → service mapping lives in the Cloudflare dashboard: point it at http://web:80.
  # Only on the edge network, so it reaches nginx but not app/db. nginx trusts CF-Connecting-IP
  # from this fixed address alone (docker/web/nginx.conf): keep the two in sync.
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    networks:
      edge:
        ipv4_address: 172.30.77.10
    depends_on:
      - web
    restart: unless-stopped

  # --- development: Vite dev server with hot reload (docker compose --profile dev up)
  vite:
    profiles: ["dev"]
    image: node:22-bookworm-slim
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npx vite --host 0.0.0.0 --port 5173"
    environment:
      API_PROXY: http://web
      NODE_EXTRA_CA_CERTS: /certs/proxy-ca.crt
    volumes:
      - ./frontend:/app
      - ./docker/certs:/certs:ro
      - vite_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - web

  # --- tests: docker compose --profile test run --rm backend-test / e2e
  backend-test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    entrypoint: []
    command: sh -c "composer install --no-interaction --prefer-dist -q && php artisan test"
    environment:
      APP_ENV: testing
      APP_KEY: base64:dGVzdGluZ2tleXRlc3RpbmdrZXl0ZXN0aW5na2V5MTI=
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"

  e2e:
    profiles: ["test"]
    image: mcr.microsoft.com/playwright:v1.63.0-noble
    working_dir: /e2e
    command: sh -c "npm ci --no-audit --no-fund && npx playwright test"
    environment:
      BASE_URL: http://web
      CI: "1"
      NODE_EXTRA_CA_CERTS: /certs/proxy-ca.crt
    volumes:
      - ./e2e:/e2e
      - ./docker/certs:/certs:ro
      - e2e_node_modules:/e2e/node_modules
    depends_on:
      - web
    ipc: host

networks:
  edge:
    ipam:
      config:
        - subnet: 172.30.77.0/24

volumes:
  pgdata:
  vite_node_modules:
  e2e_node_modules:
