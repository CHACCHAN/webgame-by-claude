server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;
    gzip_min_length 1024;
    client_max_body_size 8m;

    # Behind Cloudflare Tunnel every request comes from cloudflared: restore the visitor IP so
    # Laravel's per-IP throttles stay per player. Trusted from the cloudflared container only.
    set_real_ip_from 172.30.77.10;
    real_ip_header CF-Connecting-IP;

    # The app container's address is looked up as requests come in (Docker's DNS), not once at start-up: a deploy
    # that rebuilds only the backend gives `app` a new address, and nginx would answer 502 until it was restarted too.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $app app;

    # Laravel API via PHP-FPM
    location /api/ {
        fastcgi_pass $app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/backend/public;
        fastcgi_read_timeout 30s;
    }
    # Pusher-protocol WebSocket endpoint of Laravel Reverb (online battles)
    location /app/ {
        proxy_pass http://$app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location = /up {
        fastcgi_pass $app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
    }

    # hashed build assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # the speech model for the rivals' voice (the `tts` volume, docker/tts/fetch.sh): big files that never change
    # (a new model gets a new folder). A stack without the model answers 404 here and not the app's page: that is
    # how the game knows there is no voice
    location /tts/ {
        types { application/json json; application/octet-stream onnx; }
        default_type "text/plain; charset=utf-8";
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # web app manifest (phones: fullscreen, landscape when added to the home screen)
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
